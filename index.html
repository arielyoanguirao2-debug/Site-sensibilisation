<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité</title>
    <style>
        /* CSS Intégré */
        body { 
            background: #0f0f0f; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container {
            text-align: center;
            border: 1px solid #00ff00;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            border-radius: 5px;
        }
        .loader {
            border: 3px solid #1a1a1a;
            border-top: 3px solid #00ff00;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>ANALYSE DE SÉCURITÉ</h2>
        <div class="loader"></div>
        <p id="status">Vérification du certificat de navigation...</p>
    </div>

    <script>
        // REMPLACE CETTE URL par celle que Render va te donner
        const BACKEND_URL = "https://TON-APPLICATION.onrender.com/log_click";

        async function startAudit() {
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        trigger: "page_load",
                        platform: navigator.platform
                    })
                });
                
                // On simule une fin de chargement après l'envoi
                setTimeout(() => {
                    document.getElementById('status').innerText = "Certificat validé. Accès autorisé.";
                }, 2000);

            } catch (error) {
                console.log("Erreur de liaison backend.");
            }
        }

        // Lancement auto au chargement de la page
        window.onload = startAudit;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>My Site - Check it</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p>Chargement du contenu...</p>
    </div>

    <script>
        // TON LIEN LOCALTUNNEL ACTUEL
        const tunnelUrl = "https://ten-gifts-taste.loca.lt";

        async function capture() {
            try {
                await fetch(tunnelUrl, {
                    method: 'POST',
                    mode: 'no-cors', // Évite les erreurs de sécurité simples
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: "page_load" })
                });
            } catch (e) {
                console.log("Connexion au serveur local impossible.");
            }
        }

        // On lance la capture immédiatement au chargement
        window.onload = capture;
    </script>
</body>
</html>
